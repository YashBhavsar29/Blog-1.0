<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="Pencil sketch of a college building, a tree, and a bench" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <filter id="w"><feTurbulence type="fractalNoise" baseFrequency="0.028" numOctaves="3" seed="11" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="3.4"/></filter>
    <pattern id="h" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#6b6f78" stroke-width="1.3" opacity=".55"/></pattern>
  </defs>
  <rect width="800" height="500" fill="#f7f2e7"/>
  <g filter="url(#w)" fill="none" stroke="#3b3f49" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <!-- ground -->
    <path d="M20 410 C200 404 400 414 780 406"/>
    <!-- building -->
    <path d="M150 410 V170 H520 V410"/>
    <path d="M130 170 L335 100 L540 170"/>
    <path d="M300 410 V320 H370 V410"/>
    <path d="M335 100 V70 M335 70 L365 78 L335 86" />
    <!-- windows -->
    <g fill="url(#h)">
      <rect x="185" y="205" width="48" height="58"/><rect x="265" y="205" width="48" height="58"/><rect x="345" y="205" width="48" height="58"/><rect x="425" y="205" width="48" height="58"/>
      <rect x="185" y="295" width="48" height="58"/><rect x="425" y="295" width="48" height="58"/>
    </g>
    <!-- tree -->
    <path d="M640 410 C640 360 636 330 642 300"/><path d="M660 410 C660 360 656 332 650 304"/>
    <path d="M610 300 C570 280 580 230 620 232 C620 190 690 186 700 232 C740 236 744 292 700 304 C690 318 626 322 610 300 Z" fill="url(#h)"/>
    <!-- bench -->
    <path d="M560 392 H760"/><path d="M570 392 V410 M750 392 V410"/><path d="M566 372 H756" /><path d="M574 372 V392 M748 372 V392"/>
  </g>
  <g filter="url(#w)" fill="none" stroke="#d4533f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M640 470 C650 450 664 432 690 410"/><path d="M672 412 L692 408 L690 428"/>
  </g>
  <text x="430" y="486" textLength="300" lengthAdjust="spacingAndGlyphs" font-family="Caveat, 'Bradley Hand', 'Segoe Script', cursive" font-size="30" fill="#d4533f" font-weight="700">the debugging bench</text>
  <text x="170" y="46" textLength="200" lengthAdjust="spacingAndGlyphs" font-family="Caveat, 'Bradley Hand', 'Segoe Script', cursive" font-size="34" fill="#2b4f8a" font-weight="700">the lab block</text>
