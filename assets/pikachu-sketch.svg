<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 216" width="240" height="216" role="img" aria-label="Pencil sketch of Pikachu peeking over the edge of the page" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <filter id="pencil" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="3" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2.6" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="hatch" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(40)">
      <line x1="0" y1="0" x2="0" y2="5" stroke="#c9503f" stroke-width="1.6" opacity=".75"/>
    </pattern>
    <pattern id="hatch-dark" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(-35)">
      <line x1="0" y1="0" x2="0" y2="4" stroke="#33363d" stroke-width="1.8"/>
    </pattern>
    <g id="lines" fill="none" stroke="#4a4e57" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
      <!-- head -->
      <path d="M50 122 C48 82 88 64 121 64 C154 64 194 82 192 122 C190 160 160 178 121 178 C82 178 52 160 50 122 Z"/>
      <!-- ears -->
      <path d="M70 84 C58 60 46 36 34 10 C62 22 90 44 100 68"/>
      <path d="M142 68 C152 44 180 22 208 10 C196 36 184 60 172 84"/>
      <!-- ear tips -->
      <path d="M34 10 C38 20 42 26 48 30 C42 28 34 26 28 22 C30 18 32 14 34 10 Z" fill="url(#hatch-dark)"/>
      <path d="M208 10 C204 20 200 26 194 30 C200 28 208 26 214 22 C212 18 210 14 208 10 Z" fill="url(#hatch-dark)"/>
      <!-- eyes -->
      <circle cx="92" cy="112" r="8.5" fill="#33363d"/>
      <circle cx="151" cy="112" r="8.5" fill="#33363d"/>
      <circle cx="95" cy="109" r="2.6" fill="#f7f2e7" stroke="none"/>
      <circle cx="154" cy="109" r="2.6" fill="#f7f2e7" stroke="none"/>
      <!-- nose + mouth -->
      <path d="M118 127 L124 127 L121 131 Z" fill="#33363d"/>
      <path d="M104 140 Q112 153 121 141 Q130 153 138 140"/>
      <!-- cheeks -->
      <circle cx="66" cy="141" r="15" fill="url(#hatch)"/>
      <circle cx="176" cy="141" r="15" fill="url(#hatch)"/>
      <!-- arms + paws gripping the page edge -->
      <path d="M72 172 C70 182 72 190 76 196"/>
      <path d="M170 172 C172 182 170 190 166 196"/>
      <path d="M58 204 C58 192 70 188 82 190 C94 192 98 202 96 214"/>
      <path d="M144 214 C142 202 146 192 158 190 C170 188 182 192 182 204"/>
      <path d="M70 198 L70 208 M80 196 L80 209 M156 196 L156 209 M168 198 L168 208"/>
      <!-- little shading under chin -->
      <path d="M84 168 Q121 188 158 168" opacity=".6"/>
      <path d="M92 162 Q121 178 150 162" opacity=".4"/>
    </g>
  </defs>
  <g filter="url(#pencil)">
    <use href="#lines"/>
    <use href="#lines" transform="translate(1.2,-1)" opacity=".4"/>
  </g>
</svg>
