<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="Sketch of a breadboard with an LED, a resistor, jumper wires and a battery" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <filter id="w"><feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="2" seed="5" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="3"/></filter>
    <pattern id="holes" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="11" cy="11" r="2.6" fill="#3b3f49"/></pattern>
  </defs>
  <rect width="800" height="500" fill="#f4eedf"/>
  <g filter="url(#w)" fill="none" stroke="#3b3f49" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
    <!-- breadboard -->
    <rect x="110" y="120" width="500" height="250" rx="10"/>
    <path d="M110 245 H610" stroke-dasharray="2 10"/>
    <rect x="130" y="140" width="460" height="86" fill="url(#holes)" stroke="none"/>
    <rect x="130" y="264" width="460" height="86" fill="url(#holes)" stroke="none"/>
    <!-- LED -->
    <path d="M300 226 V190 C300 160 340 160 340 190 V226 M290 226 H350"/>
    <path d="M320 150 L336 128 M345 156 L368 140" stroke="#c9a400"/>
    <!-- resistor -->
    <path d="M400 245 H420 l8 -16 l14 32 l14 -32 l14 32 l8 -16 H490"/>
    <!-- wires -->
    <path d="M200 226 C200 300 240 320 300 300 C340 290 360 270 360 264" stroke="#d4533f"/>
    <path d="M520 226 C540 200 560 190 640 160" stroke="#2b4f8a"/>
    <!-- battery -->
    <rect x="640" y="160" width="90" height="200" rx="8"/>
    <path d="M670 160 V140 H700 V160"/>
    <path d="M660 250 H710 M660 280 H710 M672 224 H698"/>
  </g>
  <text x="130" y="418" textLength="560" lengthAdjust="spacingAndGlyphs" font-family="Caveat, 'Bradley Hand', 'Segoe Script', cursive" font-size="28" fill="#2b4f8a" font-weight="700">LED + resistor = "hello world" in hardware</text>
  <text x="300" y="104" textLength="110" lengthAdjust="spacingAndGlyphs" font-family="Caveat, 'Bradley Hand', 'Segoe Script', cursive" font-size="30" fill="#d4533f" font-weight="700">it lit up!</text>
</svg>
